# CRITICAL: This line defines the topic name.
general.kafka-topic=midas-transactions

# Consumer Configuration (These look good based on your last logs)
spring.kafka.consumer.group-id=midas-core-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# New Fix for Transaction Location: Now that you've moved Transaction.java to the root package:
spring.kafka.consumer.properties.spring.json.value.default.type=com.jpmc.midascore.Transaction
spring.kafka.consumer.properties.spring.json.trusted.packages=*