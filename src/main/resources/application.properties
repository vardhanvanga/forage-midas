# Task 1 & Kafka Setup
general.kafka-topic=midas-transactions
spring.kafka.consumer.group-id=midas-core-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# CRITICAL FIX for ClassNotFoundException (Assuming 'entity' is the correct package)
spring.kafka.consumer.properties.spring.json.value.default.type=com.jpmc.midascore.entity.Transaction

# Task 3 DB Setup (Required for persistence logic)
spring.datasource.url=jdbc:h2:mem:midasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Task 4/5 API Configuration
server.port=33400
midas.incentivize-api.url=http://incentivize-api:8080